[project]
name = "rafid-backend"
version = "0.1.0"
description = "Rafid - receivables-backed Murabaha financing for digital merchants (Amad Hackathon)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
    "greenlet>=3.0",
    "email-validator>=2.3.0",
    "rafid-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
rafid-engine = { path = "../rafid-engine" }
