<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans Arabic', sans-serif" role="img" aria-labelledby="ttl">
  <title id="ttl">Small merchants flow through Rafid's assessment engine and into Alinma for underwriting</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap');</style>
  </defs>

  <!-- background -->
  <rect width="960" height="500" rx="20" fill="#FFF7EF"/>

  <!-- ===== incoming tributaries (SMEs, right side, flowing left) ===== -->
  <g fill="none" stroke-linecap="round">
    <!-- qualified-bound streams: terracotta -->
    <path d="M880 70  C 720 80, 650 150, 540 175" stroke="#C36B4E" stroke-width="7" opacity=".9"/>
    <path d="M880 155 C 730 160, 660 175, 540 195" stroke="#C36B4E" stroke-width="7" opacity=".9"/>
    <path d="M880 245 C 720 245, 660 235, 540 218" stroke="#C36B4E" stroke-width="8" opacity=".95"/>
    <path d="M880 335 C 720 330, 650 285, 540 240" stroke="#C36B4E" stroke-width="7" opacity=".9"/>
    <!-- under-review stream: muted, peels away -->
    <path d="M880 420 C 700 415, 600 360, 560 300 C 540 275, 545 262, 555 258" stroke="#A99C8C" stroke-width="5" stroke-dasharray="2 10" opacity=".8"/>
  </g>

  <!-- SME origin nodes -->
  <g>
    <g transform="translate(880,70)"><circle r="17" fill="#F1E4DB" stroke="#C36B4E" stroke-width="1.5"/><g transform="translate(-8,-8)" stroke="#5c2b2e" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M2 5h12M4 5v9h8V5M6 2v3M10 2v3"/></g></g>
    <g transform="translate(880,155)"><circle r="17" fill="#F1E4DB" stroke="#C36B4E" stroke-width="1.5"/><g transform="translate(-8,-8)" stroke="#5c2b2e" stroke-width="1.6" fill="none" stroke-linecap="round"><rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 7h12"/></g></g>
    <g transform="translate(880,245)"><circle r="17" fill="#F1E4DB" stroke="#C36B4E" stroke-width="1.5"/><g transform="translate(-8,-8)" stroke="#5c2b2e" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M3 3h10l-1 6H4zM4 9v4h8V9M6 13v1M10 13v1"/></g></g>
    <g transform="translate(880,335)"><circle r="17" fill="#F1E4DB" stroke="#C36B4E" stroke-width="1.5"/><g transform="translate(-8,-8)" stroke="#5c2b2e" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M2 6l6-4 6 4M4 6v8h8V6"/></g></g>
    <g transform="translate(880,420)"><circle r="17" fill="#EDE3D6" stroke="#A99C8C" stroke-width="1.5"/><g transform="translate(-8,-8)" stroke="#8A7E70" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></g></g>
  </g>

  <!-- label: SMEs -->
  <text x="908" y="245" fill="#4A4238" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(90 908 245)">منشآت صغيرة ومتوسطة</text>
  <text x="884" y="462" fill="#8A7E70" font-size="12.5" text-anchor="middle">مطاعم · توصيل · تجارة إلكترونية</text>

  <!-- ===== RAFID delta (center) ===== -->
  <g transform="translate(470,205)">
    <g fill="none" stroke="#032341" stroke-width="9" stroke-linecap="round">
      <path d="M70 0  C 40 4, 26 14, 4 16"/>
      <path d="M74 22 C 42 24, 30 26, 4 27"/>
      <path d="M70 44 C 40 40, 28 32, 4 30"/>
    </g>
    <path d="M4 14 C -8 16, -14 20, -22 23 C -14 26, -8 30, 4 32 Z" fill="#C36B4E"/>
  </g>
  <text x="452" y="300" fill="#032341" font-size="26" font-weight="700" text-anchor="middle">رافد</text>

  <!-- ===== AI assessment gate (lavender lens) ===== -->
  <g transform="translate(340,228)">
    <path d="M0 -46 L 46 0 L 0 46 L -46 0 Z" fill="#EDEBF5" stroke="#8980BC" stroke-width="2"/>
    <g stroke="#6F67A8" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(-13,-13)">
      <circle cx="13" cy="13" r="9"/><path d="M13 8v10M8 13h10"/>
    </g>
  </g>
  <text x="340" y="308" fill="#26215C" font-size="15" font-weight="700" text-anchor="middle">محرّك تقييم الجدارة</text>
  <text x="340" y="328" fill="#6F67A8" font-size="12.5" text-anchor="middle">ذكاء اصطناعي · سلوك السداد</text>

  <!-- ===== qualified stream to Alinma (sage) ===== -->
  <path d="M300 220 C 250 222, 210 224, 175 226" fill="none" stroke="#2F6140" stroke-width="12" stroke-linecap="round"/>
  <path d="M300 235 C 250 236, 210 240, 175 244" fill="none" stroke="#3E7C4F" stroke-width="8" stroke-linecap="round" opacity=".85"/>

  <!-- under-review loops back up -->
  <path d="M300 258 C 340 262, 360 300, 470 300" fill="none" stroke="#A99C8C" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="470" y="322" fill="#8A7E70" font-size="12" text-anchor="start">تحت المتابعة ↺</text>

  <!-- ===== ALINMA endpoint (door mark) ===== -->
  <g transform="translate(70,175)">
    <rect x="0" y="0" width="105" height="120" rx="18" fill="#032341"/>
    <path d="M28 92 L28 44 C28 30, 40 20, 52 20 C 64 20, 77 30, 77 44 L77 92" fill="none" stroke="#F6E7DC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="52" cy="60" r="4" fill="#C36B4E"/>
  </g>
  <text x="122" y="330" fill="#032341" font-size="20" font-weight="700" text-anchor="middle">الإنماء</text>
  <text x="122" y="352" fill="#4A6B52" font-size="12.5" text-anchor="middle">اكتتاب وتمويل المنشآت</text>

  <!-- ===== flow direction + title strip ===== -->
  <text x="480" y="44" fill="#032341" font-size="19" font-weight="700" text-anchor="middle">من التاجر الصغير… إلى منشأة جاهزة للتمويل</text>
  <text x="480" y="68" fill="#8A7E70" font-size="13" text-anchor="middle">رافد يجمّع، يقيّم، ثم يرفد الإنماء بمنشآت موثوقة</text>

  <!-- legend -->
  <g font-size="12.5" fill="#6B6156">
    <rect x="300" y="452" width="14" height="6" rx="3" fill="#C36B4E"/><text x="322" y="459">تدفّق التمويل للتاجر</text>
    <rect x="470" y="452" width="14" height="6" rx="3" fill="#2F6140"/><text x="492" y="459">منشآت مؤهَّلة للإنماء</text>
    <rect x="650" y="452" width="14" height="6" rx="3" fill="#A99C8C"/><text x="672" y="459">قيد التقييم</text>
  </g>
</svg>
