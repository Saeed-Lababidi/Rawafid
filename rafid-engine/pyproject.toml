[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rafid-engine"
version = "0.1.0"
description = "Rafid AI Decision & Insights Engine — transparent, explainable merchant-financing decisions."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rafid_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
